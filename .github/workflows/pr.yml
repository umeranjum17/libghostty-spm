name: PR Build & Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Docs/evidence-only changes cannot affect the build, so skip the run
    # rather than spend macOS minutes on it. No branch protection or ruleset
    # requires this check, so a skipped run does not block a merge.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "data/**"
      - ".lavish/**"
      - "References/**"

# Zero-scope GITHUB_TOKEN: PR runs untrusted contributor code, so the
# token gets no permissions at all. Public repo, so checkout works
# without auth. No secrets referenced anywhere in this workflow.
permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Cache build derived data
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Sources/**', 'Package.swift') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: Check Licenses
        run: ./Script/check-licenses.sh

      - name: Build Package Matrix
        run: ./Script/test.sh
